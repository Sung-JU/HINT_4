<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>七顚八起 · 조립 공정 개선</title>
<style>
:root{--ink:#172842;--muted:#475c74;--blue:#2056b5;--light:#eef4fb;--line:#d5e1ef;scroll-padding-top:85px}
*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,sans-serif;color:var(--ink);background:#f5f8fc}h1,h2,h3,p{margin:0}h1,h2,h3{word-break:keep-all;line-height:1.23}a{color:var(--blue)}[hidden]{display:none!important}:focus-visible{outline:3px solid #4a83eb;outline-offset:4px}
.wrap{width:min(1080px,calc(100% - 36px));margin:auto}.top{background:#142844;color:white;position:sticky;top:0;z-index:2}.bar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:780;overflow-wrap:anywhere}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 15px;border-radius:8px;border:1px solid transparent;background:var(--blue);color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.button:hover{background:#164594}.button.secondary{background:white;color:var(--ink);border-color:var(--line)}.button.secondary:hover{background:var(--light)}.button:disabled{opacity:.55;cursor:default}
.hero{background:#142844;color:white;padding:clamp(44px,8vw,94px) 0;border-bottom:5px solid #4c83e8}.hero h1{font-size:clamp(34px,6vw,65px);letter-spacing:-.055em;max-width:830px;margin:12px 0 16px}.hero p{color:#d1e0f5}.hero .team{font-weight:800;color:#a8c8ff}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
main{padding:36px 0 60px;display:grid;gap:32px}section h2{font-size:clamp(24px,4vw,34px);letter-spacing:-.035em;margin-bottom:15px}.roster,.story{display:grid;gap:12px}.roster{grid-template-columns:repeat(4,minmax(0,1fr))}.story{grid-template-columns:1.55fr 1fr 1fr}.tile,.resources{border:1px solid var(--line);border-radius:12px;background:white;padding:clamp(16px,3vw,25px);overflow-wrap:anywhere}.tile h3{font-size:17px;color:var(--blue);margin-bottom:10px}.tile p,.tile ul{white-space:pre-wrap}.tile ul{margin:0;padding:0;list-style:none}.story .tile{border-top:4px solid #86a8df}.story .tile:last-child{border-top-color:var(--blue)}.resources p{color:var(--muted)}
dialog{width:min(680px,calc(100% - 24px));max-height:calc(100dvh - 24px);border:1px solid var(--line);border-radius:13px;padding:0;color:var(--ink)}dialog::backdrop{background:#101c30aa}.dialog-head,.dialog-foot{position:sticky;background:white;padding:13px 20px;z-index:1}.dialog-head{top:0;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:23px}.dialog-body{padding:12px 20px 22px}.dialog-foot{bottom:0;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.dialog-body label{display:block;margin:10px 0 4px;font-weight:680}.dialog-body input,.dialog-body textarea{width:100%;min-width:0;border:1px solid #a7b9cf;background:#f7faff;border-radius:7px;padding:8px 10px;color:var(--ink);font:inherit}.dialog-body textarea{resize:vertical;min-height:80px}.hint,.status{font-size:14px;color:var(--muted)}.status{min-height:1.5em}.status:empty{display:none}
@media(max-width:760px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}.story{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><span class="brand" id="brand"></span><button class="button secondary" type="button" id="edit">수정</button></div></header>
<div class="hero"><div class="wrap">
<p class="team" id="team"></p>
<h1>조립순서 결정에<br>과거 불량 이력을 활용하는 방법</h1>
<p>작업 조건과 품질 결과를 비교하기 위한 조립 이력 입력 양식</p>
<div class="actions"><a class="button secondary" href="#project">프로젝트 소개 보기 ↓</a><a class="button app-link" target="_blank" rel="noopener noreferrer">완성한 앱 열기 ↗</a></div>
</div></div>
<main class="wrap" id="project">
<section aria-labelledby="members-title"><h2 id="members-title">팀원과 역할</h2><div class="roster" id="roster"></div></section>
<section aria-labelledby="story-title"><h2 id="story-title">문제에서 해결안까지</h2><div class="story">
<article class="tile"><h3>문제 정의</h3><p id="problem-text"></p></article>
<article class="tile"><h3>최종 선택한 진짜 원인</h3><p id="cause-text"></p></article>
<article class="tile"><h3>해결안</h3><p id="solution-text"></p></article>
</div></section>
<section class="resources" aria-labelledby="resources-title"><h2 id="resources-title">4일차 기획서</h2><p>자동차 조립 공정설계 개선 자료</p><div class="actions"><a class="button" id="plan-link" target="_blank" rel="noopener noreferrer">PPT 다운로드 ↓</a></div><p class="status" id="notice" role="status"></p></section>
</main>
<dialog id="editor" aria-labelledby="editor-title">
<form id="editor-form">
<div class="dialog-head"><h2 id="editor-title">프로젝트 내용 수정</h2><p class="hint">변경 내용은 이 브라우저에 저장됩니다.</p></div>
<div class="dialog-body">
<label for="teamName">팀명</label><input id="teamName" name="teamName" required>
<label for="pm">PM</label><input id="pm" name="pm">
<label for="presenter">기록/발표자</label><input id="presenter" name="presenter">
<label for="researchers">리서처</label><input id="researchers" name="researchers" aria-describedby="names-hint">
<label for="analyst">분석가</label><input id="analyst" name="analyst">
<p class="hint" id="names-hint">여러 이름은 쉼표로 구분하세요.</p>
<label for="problem">문제 정의</label><textarea id="problem" name="problem" rows="5"></textarea>
<label for="cause">최종 선택한 진짜 원인</label><textarea id="cause" name="cause"></textarea>
<label for="solution">해결안</label><textarea id="solution" name="solution"></textarea>
<label for="planUrl">4일차 기획서 PPT 주소</label><input id="planUrl" name="planUrl" type="text" inputmode="url" required>
<p class="hint">Google Drive 공유 주소를 입력하세요.</p>
<label for="appUrl">완성한 앱/웹 주소</label><input id="appUrl" name="appUrl" type="url" required>
<p class="status" id="edit-error" role="alert"></p>
</div>
<div class="dialog-foot"><button type="button" class="button secondary" id="cancel">취소</button><button type="submit" class="button">저장</button></div>
</form>
</dialog>
<script>
const defaults = {
  teamName: '七顚八起',
  pm: '박승빈',
  presenter: '고재현',
  researchers: '김성준, 김만기, 박승용',
  analyst: '최은초',
  problem: '공정 설계자는 작업순서를 정하는 시점에 과거 불량 이력을 바로 확인할 수 없는 상황에서 고연차 실무자의 감과 회의에 기대어 순서를 정해야 하는 불편을 겪고, 그 결과 대기 시간의 낭비가 생긴다. 따라서 우리는 작업순서 결정 시 품질, 공정 이력을 바로 비교할 수 있는 도구 혹은 기준을 기획한다.',
  cause: '공정별 작업 조건과 품질 결과를 분석할 수 있는 시각화, 분석 도구 부재',
  solution: '조립 이력 입력 양식\n조립 결과를 등록할 때 조립 순서, 조건, 불량 수량을 필수로 입력하면 불량률이 자동 계산되어 목록에 쌓인다.',
  planUrl: 'https://docs.google.com/presentation/d/1ueUa_2c8CYlfEp6lDfw8X-Q1Swz_g2n_/edit?usp=drivesdk&ouid=118022125841254880920&rtpof=true&sd=true',
  appUrl: 'https://script.google.com/macros/s/AKfycbxQfOycow9vvkU3Gp6n_qUgZYboQoox1SbtYgCuw3DcOtMN6v-P4KRSnLaPSinms7b8Bg/exec'
};
const key = 'hint-project-page.export.v1';
const roles = [['pm','PM'],['presenter','기록/발표자'],['researchers','리서처'],['analyst','분석가']];
const editor = document.querySelector('#editor');
const form = document.querySelector('#editor-form');
const editError = document.querySelector('#edit-error');
const notice = document.querySelector('#notice');
const plan = document.querySelector('#plan-link');
let content = {...defaults};
function webUrl(value) {
  try {
    const url = new URL(value);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
  } catch { return ''; }
}
try {
  const saved = JSON.parse(localStorage.getItem(key));
  for (const field of Object.keys(defaults)) {
    if (typeof saved?.[field] === 'string') content[field] = saved[field];
  }
  if (content.appUrl === 'https://docs.google.com/spreadsheets/d/1JveDBUI3EYvhNLmDo0JEpg-Xw401Eml4q2RrNF0fw1o/edit?usp=sharing') content.appUrl = defaults.appUrl;
} catch {
  notice.textContent = '저장한 내용을 불러올 수 없어 기본 내용을 표시합니다.';
}
function render() {
  document.querySelector('#brand').textContent = content.teamName;
  document.querySelector('#team').textContent = content.teamName;
  const roster = document.querySelector('#roster');
  roster.replaceChildren();
  for (const [key, role] of roles) {
    const tile = document.createElement('article');
    tile.className = 'tile';
    const heading = document.createElement('h3');
    heading.textContent = role;
    const list = document.createElement('ul');
    const names = content[key].split(',').map(name => name.trim()).filter(Boolean);
    for (const name of names.length ? names : ['미입력']) {
      const item = document.createElement('li');
      item.textContent = name;
      list.append(item);
    }
    tile.append(heading, list);
    roster.append(tile);
  }
  for (const field of ['problem','cause','solution']) {
    document.querySelector('#' + field + '-text').textContent = content[field] || '미입력';
  }
  plan.href = webUrl(content.planUrl) || defaults.planUrl;
  const appUrl = webUrl(content.appUrl);
  for (const link of document.querySelectorAll('.app-link')) {
    link.hidden = !appUrl;
    if (appUrl) link.href = appUrl;
    else link.removeAttribute('href');
  }
}
document.querySelector('#edit').addEventListener('click', () => {
  for (const field of Object.keys(defaults)) form.elements[field].value = content[field];
  editError.textContent = '';
  editor.showModal();
});
document.querySelector('#cancel').addEventListener('click', () => editor.close());
form.addEventListener('submit', event => {
  event.preventDefault();
  const next = Object.fromEntries(Object.keys(defaults).map(field => [field, form.elements[field].value.trim()]));
  if (!next.teamName || !webUrl(next.planUrl) || !webUrl(next.appUrl)) {
    editError.textContent = '팀명과 올바른 http:// 또는 https:// 주소를 입력하세요.';
    return;
  }
  try {
    localStorage.setItem(key, JSON.stringify(next));
  } catch {
    editError.textContent = '저장하지 못했습니다. 브라우저 저장 설정을 확인하세요.';
    return;
  }
  content = next;
  render();
  editor.close();
  notice.textContent = '수정한 내용을 이 브라우저에 저장했습니다.';
});
render();
</script>
</body>
</html>
